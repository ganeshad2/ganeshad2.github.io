<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            position: relative;
        }

        /* Floating hearts background */
        .heart-bg {
            position: absolute;
            font-size: 30px;
            opacity: 0.3;
            animation: float 6s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-30px) rotate(10deg);
            }
        }

        .container {
            background: white;
            padding: 60px 50px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
            z-index: 10;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .cybertruck-img {
            width: 120px;
            height: auto;
            margin-bottom: 10px;
            opacity: 0.8;
        }

        .heart-icon {
            font-size: 80px;
            animation: heartbeat 1.5s infinite;
            display: inline-block;
            margin-bottom: 20px;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            10%, 30% {
                transform: scale(1.1);
            }
            20%, 40% {
                transform: scale(1);
            }
        }

        h1 {
            color: #764ba2;
            font-size: 2.5em;
            margin-bottom: 30px;
            font-weight: 700;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .yes-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .yes-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
        }

        .no-btn {
            background: #e0e0e0;
            color: #999;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: white;
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: popIn 0.5s ease;
            position: relative;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-heart {
            font-size: 100px;
            animation: heartbeat 1s infinite;
            margin-bottom: 20px;
        }

        .modal-content h2 {
            color: #f5576c;
            font-size: 2.5em;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .modal-content p {
            color: #764ba2;
            font-size: 1.3em;
            font-weight: 500;
        }

        /* Confetti */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #f5576c;
            animation: confettiFall 3s linear infinite;
        }

        @keyframes confettiFall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }
            
            .buttons {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Background hearts -->
    <div class="heart-bg" style="top: 10%; left: 10%;">💕</div>
    <div class="heart-bg" style="top: 20%; right: 15%; animation-delay: 1s;">❤️</div>
    <div class="heart-bg" style="bottom: 15%; left: 20%; animation-delay: 2s;">💗</div>
    <div class="heart-bg" style="bottom: 25%; right: 10%; animation-delay: 1.5s;">💖</div>
    <div class="heart-bg" style="top: 50%; left: 5%; animation-delay: 0.5s;">💝</div>
    <div class="heart-bg" style="top: 60%; right: 5%; animation-delay: 2.5s;">💓</div>

    <div class="container">
        <!-- Cybertruck SVG -->
        <svg class="cybertruck-img" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
            <g fill="#C0C0C0" stroke="#808080" stroke-width="2">
                <!-- Body -->
                <polygon points="30,70 50,40 90,30 130,30 160,50 170,70" fill="#E8E8E8"/>
                <!-- Windows -->
                <polygon points="55,42 85,35 85,50 60,50" fill="#87CEEB" opacity="0.6"/>
                <polygon points="95,35 125,35 145,50 95,50" fill="#87CEEB" opacity="0.6"/>
                <!-- Wheels -->
                <circle cx="60" cy="75" r="12" fill="#333"/>
                <circle cx="60" cy="75" r="6" fill="#666"/>
                <circle cx="145" cy="75" r="12" fill="#333"/>
                <circle cx="145" cy="75" r="6" fill="#666"/>
                <!-- Details -->
                <line x1="90" y1="30" x2="90" y2="70" stroke="#999" stroke-width="1"/>
            </g>
        </svg>
        
        <div class="heart-icon">💖</div>
        <h1>Will You Be My Valentine?</h1>
        <div class="buttons">
            <button class="yes-btn" onclick="showLove()">Yes! 💕</button>
            <button class="no-btn" disabled>No</button>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="loveModal">
        <div class="modal-content">
            <div class="modal-heart">❤️</div>
            <h2>I Love You</h2>
            <p>Lilaani</p>
        </div>
    </div>

    <script>
        function showLove() {
            const modal = document.getElementById('loveModal');
            modal.style.display = 'flex';
            createConfetti();
        }

        function createConfetti() {
            const colors = ['#f5576c', '#f093fb', '#764ba2', '#667eea', '#ff6b9d'];
            
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() * 2 + 's';
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 5000);
                }, i * 50);
            }
        }

        // Close modal when clicking outside
        document.getElementById('loveModal').addEventListener('click', function(e) {
            if (e.target === this) {
                this.style.display = 'none';
            }
        });
    </script>
</body>
</html>
